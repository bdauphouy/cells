<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" role="img" aria-labelledby="title desc">
  <title id="title">DaVinci Resolve-style logo with petals moved down</title>
  <desc id="desc">Three identical enlarged petals with equal gaps, shifted downward to reduce the bottom clearance.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12c9cf"/><stop offset=".28" stop-color="#b5f51c"/><stop offset=".55" stop-color="#f5b22c"/><stop offset=".78" stop-color="#f3444e"/><stop offset="1" stop-color="#a988c8"/></linearGradient>
    <linearGradient id="cyan" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#04f4ee"/><stop offset=".62" stop-color="#16badc"/><stop offset="1" stop-color="#f3c9dc"/></linearGradient>
    <linearGradient id="yellow" x1=".1" y1=".1" x2=".85" y2=".9"><stop stop-color="#d9ff54"/><stop offset=".58" stop-color="#eff22e"/><stop offset="1" stop-color="#f4b92a"/></linearGradient>
    <linearGradient id="red" x1=".15" y1=".05" x2=".85" y2=".95"><stop stop-color="#ffd0ba"/><stop offset=".45" stop-color="#f73568"/><stop offset="1" stop-color="#ef6429"/></linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="0" dy="0.24" stdDeviation="0.264" flood-color="#000" flood-opacity=".48"/></filter>
    <path id="petal" d="M12 4.632 C10.248 4.632 8.904 5.952 8.904 7.584 C8.904 8.976 9.936 10.392 11.208 11.64 C11.568 12 11.784 12.264 12 12.264 C12.216 12.264 12.432 12 12.792 11.64 C14.064 10.392 15.096 8.976 15.096 7.584 C15.096 5.952 13.752 4.632 12 4.632Z"/>
  </defs>
  <rect x="2.977" y="2.977" width="18.046" height="18.046" rx="3.276" fill="url(#border)" filter="url(#shadow)"/>
  <rect x="3.819" y="3.819" width="16.361" height="16.361" rx="2.471" fill="#1d344a" stroke="#12243a" stroke-width="0.337"/>

  <!-- The complete mark is inset ~22% and shifted down from the prior centered/full-bleed version. -->
  <g transform="translate(2.64 3.726) scale(0.78)" filter="url(#shadow)" stroke="#17273a" stroke-width="0.168" stroke-linejoin="round">
    <use href="#petal" transform="rotate(0 12 12) translate(0 -0.66) translate(12 12) scale(1.2) translate(-12 -12)" fill="url(#cyan)"/>
    <use href="#petal" transform="rotate(120 12 12) translate(0 -0.66) translate(12 12) scale(1.2) translate(-12 -12)" fill="url(#red)"/>
    <use href="#petal" transform="rotate(240 12 12) translate(0 -0.66) translate(12 12) scale(1.2) translate(-12 -12)" fill="url(#yellow)"/>
  </g>
</svg>